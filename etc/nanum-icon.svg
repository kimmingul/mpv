<?xml version="1.0" encoding="UTF-8"?>
<!-- NanumPlayer application icon (source artwork). etc/nanum-icon.py renders the
     same drawing into etc/nanum-icon.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D3F2"/>
      <stop offset="1" stop-color="#2B63FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="110" rx="58" fill="url(#shine)"/>
  <!-- N -->
  <polygon points="70,58 102,58 102,172 70,172" fill="#FFFFFF"/>
  <polygon points="154,58 186,58 186,172 154,172" fill="#FFFFFF"/>
  <polygon points="70,58 108,58 186,172 148,172" fill="#FFFFFF"/>
  <!-- subtitle lines -->
  <rect x="66" y="190" width="124" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="92" y="210" width="72" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.67"/>
</svg>
